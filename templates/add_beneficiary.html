{% extends 'base.html' %}
{% block content %}
<div class="bg-white p-6 rounded-lg shadow-md">
    <h2 class="text-2xl font-bold mb-4">Ajouter un Bénéficiaire</h2>
    <form method="post">
        {% csrf_token %}
        <div class="mb-4">
            <label class="block text-gray-700">Nom</label>
            <input type="text" name="name" class="w-full p-2 border rounded-md" required>
        </div>
        <div class="mb-4">
            <label class="block text-gray-700">Numéro de Compte</label>
            <input type="text" name="account_number" class="w-full p-2 border rounded-md" required>
        </div>
        <div class="mb-4">
            <label class="block text-gray-700">Nom de la Banque</label>
            <input type="text" name="bank_name" class="w-full p-2 border rounded-md" required>
        </div>
        <button type="submit" class="bg-blue-500 text-white p-2 rounded-md hover:bg-blue-600">Ajouter</button>
    </form>
</div>
{% endblock %}
