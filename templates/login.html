{% load static %}
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <style>
        .dark-mode {
            background-color: #1a202c; /* Couleur de fond sombre */
            color: #ffffff; /* Texte blanc */
        }
        .dark-mode .bg-white {
            background-color: #2d3748; /* Couleur de fond sombre pour les éléments blancs */
        }
        .dark-mode .text-gray-700 {
            color: #cbd5e0; /* Texte gris clair pour les éléments sombres */
        }
        .dark-mode .border-gray-300 {
            border-color: #4a5568; /* Bordure grise pour les éléments sombres */
        }
        .image-container {
            width: 110%; /* Agrandir la largeur de l'image */
            transform: rotate(-3deg) translateX(-5%); /* Incliner légèrement vers la gauche */
            transform-origin: top left; /* Point d'origine de la transformation */
        }
        .logo {
            background-color: #2563eb; /* Bleu 600 */
            color: white;
            border: 4px solid white;
            border-radius: 50%;
            width: 60px;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            font-weight: bold;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            position: relative;
            overflow: hidden;
            animation: pulse 2s infinite; /* Animation de pulsation */
        }

        /* Effet de surbrillance */
        .logo::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.5), rgba(255, 255, 255, 0) 70%);
            transform: rotate(45deg);
            opacity: 0;
            transition: opacity 0.5s ease;
        }

        /* Animation de surbrillance au survol */
        .logo:hover::before {
            opacity: 1;
        }

        /* Animation de pulsation */
        @keyframes pulse {
            0% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.1);
            }
            100% {
                transform: scale(1);
            }
        }
    </style>
</head>
<body class="h-screen flex flex-col md:flex-row">
    <!-- Logo en haut à gauche -->
    <div class="fixed top-4 left-4">
        <div class="logo">
            NM
        </div>
    </div>

    <!-- Bouton Toggle en haut à droite -->
    <button id="theme-toggle" class="fixed top-4 right-4 p-2 bg-blue-500 text-white rounded-full shadow-lg hover:bg-blue-600 transition duration-300">
        🌙
    </button>

    <!-- Partie Gauche (Formulaire de Connexion) -->
    <div class="w-full md:w-1/2 bg-gray-50 flex items-center justify-center p-8 ">
        <div class="bg-white p-8 rounded-lg shadow-md w-full max-w-md">
            <h1 class="text-2xl font-bold mb-6 text-center">Connexion</h1>
            <form method="post" class="space-y-4">
                {% csrf_token %}
                <div>
                    <label for="username" class="block text-sm font-medium text-gray-700">Nom d'utilisateur</label>
                    <input type="text" name="username" id="username" class="mt-1 block w-full p-2 border border-gray-300 rounded-md" required>
                </div>
                <div>
                    <label for="password" class="block text-sm font-medium text-gray-700">Mot de passe</label>
                    <input type="password" name="password" id="password" class="mt-1 block w-full p-2 border border-gray-300 rounded-md" required>
                </div>
                <div>
                    <button type="submit" class="w-full bg-blue-500 text-white p-2 rounded-md hover:bg-blue-600">Se connecter</button>
                </div>
            </form>
        </div>
    </div>

    
    <!-- Partie Droite (Image) -->
        <div class="w-full md:w-1/2 flex items-center justify-center p-8">
            <div class="h-5/6 border-4 border-blue-500 rounded-lg overflow-hidden transform -rotate-6">
                <img src="{% static 'img/img.png' %}" alt="Image" class="w-full h-full object-cover">
            </div>
        </div>


    <script>
        // Script pour basculer entre le mode sombre et le mode clair
        const themeToggle = document.getElementById('theme-toggle');
        const body = document.body;

        themeToggle.addEventListener('click', () => {
            body.classList.toggle('dark-mode');
            if (body.classList.contains('dark-mode')) {
                themeToggle.textContent = '☀️'; // Icône soleil pour le mode clair
            } else {
                themeToggle.textContent = '🌙'; // Icône lune pour le mode sombre
            }
        });
    </script>
</body>
</html>
