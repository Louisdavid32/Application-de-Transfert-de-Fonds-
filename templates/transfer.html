{% extends "base.html" %}

{% block content %}
<div class="bg-white p-4 rounded-lg shadow-md">
  <h1 class="text-2xl font-bold mb-4">Transfert d'argent</h1>

  <form id="transfer-form" method="post" class="space-y-4">
    {% csrf_token %}
    <div>
      <label for="receiver" class="block text-sm font-medium text-gray-700">Destinataire</label>
      <input type="text" name="receiver" id="receiver" class="mt-1 block w-full p-2 border border-gray-300 rounded-md" required>
    </div>
    <div>
      <label for="amount" class="block text-sm font-medium text-gray-700">Montant</label>
      <input type="number" step="0.01" name="amount" id="amount" class="mt-1 block w-full p-2 border border-gray-300 rounded-md" required>
    </div>
    <div>
      <label for="description" class="block text-sm font-medium text-gray-700">Description (facultatif)</label>
      <textarea name="description" id="description" class="mt-1 block w-full p-2 border border-gray-300 rounded-md"></textarea>
    </div>
    <div>
      <button type="submit" class="bg-blue-500 text-white p-2 rounded-md hover:bg-blue-600">Transférer</button>
    </div>
  </form>

  <div id="message" class="mt-4"></div>
</div>

<script>
  document.getElementById('transfer-form').addEventListener('submit', function (e) {
  e.preventDefault();  // Empêcher le rechargement de la page
  console.log('Formulaire soumis');  // Vérifiez que ce message apparaît dans la console
});
    const formData = new FormData(this);

    fetch('{% url "transfer_funds" %}', {
      method: 'POST',
      body: formData,
      headers: {
        'X-CSRFToken': '{{ csrf_token }}',  // Inclure le jeton CSRF
      },
    })
    .then(response => response.json())
    .then(data => {
      const messageDiv = document.getElementById('message');
      if (data.success) {
        messageDiv.innerHTML = `<p class="text-green-500">${data.message}</p>`;
        // Mettre à jour le solde affiché (si vous avez un élément pour afficher le solde)
        const balanceElement = document.getElementById('balance');
        if (balanceElement) {
          balanceElement.textContent = `Solde : ${data.new_balance} €`;
        }
      } else {
        messageDiv.innerHTML = `<p class="text-red-500">${data.error}</p>`;
      }
    })
    .catch(error => {
      console.error('Erreur:', error);
    });
  });
</script>
{% endblock %}
