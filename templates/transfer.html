{% extends "base.html" %}

{% block content %}
<div class="bg-white p-6 rounded-lg shadow-md">
  <!-- En-tête -->
  <div class="mb-6">
    <h1 class="text-2xl font-bold">Transfert d'argent</h1>
    <p class="text-gray-600">Veuillez fournir les détails du transfert.</p>
  </div>

  <!-- Formulaire de Transfert -->
  <form id="transfer-form" method="post" class="space-y-6">
    {% csrf_token %}

    <!-- Détails du Destinataire -->
    <div>
      <h2 class="text-lg font-semibold mb-2">Détails du Destinataire</h2>
      <div class="space-y-4">
        <div>
          <label for="receiver" class="block text-sm font-medium text-gray-700">Nom du Destinataire</label>
          <input type="text" name="receiver" id="receiver" class="mt-1 block w-full p-2 border border-gray-300 rounded-md" required>
        </div>
        <div>
          <label for="email" class="block text-sm font-medium text-gray-700">Adresse Email du Destinataire</label>
          <input type="email" name="email" id="email" class="mt-1 block w-full p-2 border border-gray-300 rounded-md" >
        </div>
        <div>
          <label for="account_number" class="block text-sm font-medium text-gray-700">Numéro de Compte du Destinataire</label>
          <input type="text" name="account_number" id="account_number" class="mt-1 block w-full p-2 border border-gray-300 rounded-md" >
        </div>
      </div>
    </div>

    <!-- Sélection de la Banque Source -->
    <div>
      <h2 class="text-lg font-semibold mb-2">Sélection de la Banque Source</h2>
      <div>
        <label for="source_bank" class="block text-sm font-medium text-gray-700">Sélectionnez le compte source</label>
        <select name="source_bank" id="source_bank" class="mt-1 block w-full p-2 border border-gray-300 rounded-md" >
          <option value="">Choisissez un compte</option>
          {% for account in bank_accounts %}
          <option value="{{ account.id }}">{{ account.account_name }} - {{ account.balance }} €</option>
          {% endfor %}
        </select>
      </div>
    </div>

    <!-- Montant et Description -->
    <div>
      <h2 class="text-lg font-semibold mb-2">Détails du Transfert</h2>
      <div class="space-y-4">
        <div>
          <label for="amount" class="block text-sm font-medium text-gray-700">Montant</label>
          <input type="number" step="0.01" name="amount" id="amount" class="mt-1 block w-full p-2 border border-gray-300 rounded-md" required>
        </div>
        <div>
          <label for="description" class="block text-sm font-medium text-gray-700">Note de Transfert (facultatif)</label>
          <textarea name="description" id="description" class="mt-1 block w-full p-2 border border-gray-300 rounded-md" rows="3"></textarea>
        </div>
      </div>
    </div>

    <!-- Bouton de Soumission -->
    <div>
      <button type="submit" class="bg-blue-500 text-white p-2 rounded-md hover:bg-blue-600 w-full">
        Transférer
      </button>
    </div>
  </form>

  <!-- Message de Réponse -->
  <div id="message" class="mt-6"></div>
</div>

  <!-- Toast Notification -->
  <!-- Dans base.html -->
<div id="toast" class="hidden fixed bottom-4 right-4 bg-green-500 text-white p-4 rounded-lg shadow-lg">
  Transfert effectué avec succès !
</div>



<script>


    function showToast(message) {
        const toast = document.getElementById('toast');
        toast.textContent = message;  // Met à jour le message du toast
        toast.classList.remove('hidden');  // Affiche le toast

        // Masque le toast après 3 secondes
        setTimeout(() => {
            toast.classList.add('hidden');
        }, 10000);
    }

    // Affiche le toast si un message de succès est présent
    {% for message in messages %}
        {% if message.tags == 'success' and "réussi" in message|lower %}
            showToast("{{ message }}");
        {% endif %}
    {% endfor %}



  document.getElementById('transfer-form').addEventListener('submit', function (e) {
    e.preventDefault();  // Empêcher le rechargement de la page

    const formData = new FormData(this);

    fetch('{% url "transfer_funds" %}', {
      method: 'POST',
      body: formData,
      headers: {
        'X-CSRFToken': '{{ csrf_token }}',  // Inclure le jeton CSRF
      },
    })
    .then(response => response.json())
    .then(data => {
      const messageDiv = document.getElementById('message');
      if (data.success) {
        messageDiv.innerHTML = `<p class="text-green-500">${data.message}</p>`;
        // Mettre à jour le solde affiché (si vous avez un élément pour afficher le solde)
        const balanceElement = document.getElementById('balance');
        if (balanceElement) {
          balanceElement.textContent = `Solde : ${data.new_balance} €`;
        }
      } else {
        messageDiv.innerHTML = `<p class="text-red-500">${data.error}</p>`;
      }
    })
    .catch(error => {
      console.error('Erreur:', error);
    });
  });




</script>
{% endblock %}
